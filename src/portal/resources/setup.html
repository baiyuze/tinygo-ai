<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ESP32-S3 AI</title>
  <style>
    body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;margin:18px;line-height:1.45;background:#f7f7f4;color:#151515}
    h2{margin:0 0 14px;font-size:22px}
    h3{margin:24px 0 10px;font-size:18px}
    label{display:block;margin:12px 0 6px;font-weight:600}
    input,textarea{box-sizing:border-box;width:100%;font-size:16px;padding:10px;border:1px solid #b8b8b0;border-radius:6px;background:white}
    textarea{min-height:86px;resize:vertical}
    button{margin-top:12px;width:100%;font-size:16px;padding:12px;background:#0b72e7;color:white;border:0;border-radius:6px}
    button.secondary{background:#444}
    .hint{color:#555;font-size:14px}
    .panel{display:none;margin:12px 0;padding:12px;border-radius:6px;background:white;border:1px solid #d8d8d0}
    .panel.active{display:block}
    .ok{border-color:#6aa66a}
    .err{border-color:#c46b5f}
    #chatlog{min-height:160px;max-height:360px;overflow:auto;background:white;border:1px solid #d8d8d0;border-radius:6px;padding:10px}
    .msg{margin:0 0 12px;white-space:pre-wrap;word-break:break-word}
    .role{font-weight:700;color:#0b72e7}
    .assistant .role{color:#277a3b}
    .error{color:#b3261e}
  </style>
</head>
<body>
  <h2>ESP32-S3 AI 配置</h2>

  <section id="saved" class="panel ok">已保存。设备会尝试连接 WiFi；重启后 API Key 和系统提示词仍会生效。</section>
  <section id="error" class="panel err">保存失败，WiFi 名称不能为空。</section>

  <form method="post" action="/save" onsubmit="saveLocal()">
    <label>WiFi 名称</label>
    <input id="ssid" name="ssid" required>

    <label>WiFi 密码</label>
    <input id="password" name="password" type="password">

    <label>DeepSeek API Key</label>
    <input id="apikey" name="apikey" type="password" autocomplete="off">

    <label>系统提示词</label>
    <textarea id="systemprompt" name="systemprompt" maxlength="1024">You are a helpful assistant.</textarea>

    <button>保存并连接</button>
  </form>

  <h3>大模型对话</h3>
  <div id="chatlog"></div>
  <label>用户消息</label>
  <textarea id="usertext" placeholder="输入要发送给 DeepSeek 的内容"></textarea>
  <button onclick="sendChat()" type="button">发送</button>
  <button class="secondary" onclick="clearChat()" type="button">清空对话</button>
  <p id="chatstatus" class="hint"></p>

  <p class="hint">对话请求由当前浏览器直接发往 DeepSeek：模型 deepseek-v4-pro，thinking enabled，reasoning_effort high。</p>
  <p class="hint">如果浏览器提示 Failed to fetch，通常是跨域限制；后续可改成设备端 HTTPS 代理。</p>

  <script>
    const fields = ["ssid","password","apikey","systemprompt"];
    let messages = [];

    for (const k of fields) {
      const v = localStorage.getItem(k);
      if (v) document.getElementById(k).value = v;
    }

    fetch("/config.json").then(r => r.json()).then(cfg => {
      if (cfg.apiKey) document.getElementById("apikey").value = cfg.apiKey;
      if (cfg.systemPrompt) document.getElementById("systemprompt").value = cfg.systemPrompt;
    }).catch(() => {});

    const status = new URLSearchParams(location.search).get("status");
    if (status === "saved") document.getElementById("saved").classList.add("active");
    if (status === "error") document.getElementById("error").classList.add("active");

    function saveLocal() {
      for (const k of fields) localStorage.setItem(k, document.getElementById(k).value);
    }

    function addMessage(role, text, isError) {
      const box = document.createElement("div");
      box.className = "msg " + role + (isError ? " error" : "");
      const title = role === "assistant" ? "AI" : role === "system" ? "系统" : "我";
      box.innerHTML = '<span class="role"></span><br><span class="content"></span>';
      box.querySelector(".role").textContent = title;
      box.querySelector(".content").textContent = text;
      document.getElementById("chatlog").appendChild(box);
      box.scrollIntoView({block:"end"});
    }

    function clearChat() {
      messages = [];
      document.getElementById("chatlog").textContent = "";
      document.getElementById("chatstatus").textContent = "";
    }

    async function sendChat() {
      const apiKey = document.getElementById("apikey").value.trim();
      const system = document.getElementById("systemprompt").value.trim();
      const textEl = document.getElementById("usertext");
      const text = textEl.value.trim();
      const statusEl = document.getElementById("chatstatus");
      if (!apiKey) { statusEl.textContent = "请先填写 DeepSeek API Key。"; return; }
      if (!text) { statusEl.textContent = "请输入消息。"; return; }

      saveLocal();
      textEl.value = "";
      messages.push({role:"user", content:text});
      addMessage("user", text);
      statusEl.textContent = "正在请求 DeepSeek...";

      const reqMessages = [];
      if (system) reqMessages.push({role:"system", content:system});
      for (const m of messages) reqMessages.push(m);

      try {
        const res = await fetch("https://api.deepseek.com/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + apiKey
          },
          body: JSON.stringify({
            model: "deepseek-v4-pro",
            messages: reqMessages,
            thinking: {type: "enabled"},
            reasoning_effort: "high",
            stream: false
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error && data.error.message ? data.error.message : "HTTP " + res.status);
        const reply = data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : "";
        messages.push({role:"assistant", content:reply});
        addMessage("assistant", reply || "(空响应)");
        statusEl.textContent = "完成";
      } catch (err) {
        addMessage("assistant", String(err), true);
        statusEl.textContent = "调用失败";
      }
    }
  </script>
</body>
</html>
